```html
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>所持金管理</title>

    <!-- PWA設定 -->
    <link rel="manifest" href="manifest.json" />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app">
      <h1>💰 所持金管理</h1>

      <!-- 現在の所持金 -->

      <div class="money-box">
        <p>現在の所持金</p>

        <div id="money">¥0</div>
      </div>

      <!-- 収入・支出 -->

      <div class="button-area">
        <button id="incomeButton" class="income-button">＋ 収入</button>

        <button id="expenseButton" class="expense-button">− 支出</button>
      </div>

      <!-- 入力フォーム -->

      <div id="formArea" class="form-area">
        <h2 id="formTitle">収入を追加</h2>

        <label>
          金額

          <input type="number" id="amount" placeholder="例：10000" />
        </label>

        <label>
          内容

          <input type="text" id="name" placeholder="例：アルバイト" />
        </label>

        <label>
          カテゴリ

          <select id="category">
            <option value="給料">給料</option>

            <option value="お小遣い">お小遣い</option>

            <option value="その他">その他</option>
          </select>
        </label>

        <div class="form-buttons">
          <button id="addButton">追加する</button>

          <button id="cancelButton">キャンセル</button>
        </div>
      </div>

      <!-- 今月の収支 -->

      <div class="summary">
        <h2>📊 今月の収支</h2>

        <div class="summary-row">
          <span> 収入 </span>

          <strong id="monthlyIncome"> ¥0 </strong>
        </div>

        <div class="summary-row">
          <span> 支出 </span>

          <strong id="monthlyExpense"> ¥0 </strong>
        </div>

        <hr />

        <div class="summary-row balance">
          <span> 残り </span>

          <strong id="monthlyBalance"> ¥0 </strong>
        </div>
      </div>

      <!-- カテゴリ別支出 -->

      <div class="category-box">
        <h2>🍀 カテゴリ別支出</h2>

        <div id="categoryChart"></div>
      </div>

      <!-- 履歴 -->

      <div class="history-box">
        <h2>📝 履歴</h2>

        <div id="history"></div>
      </div>
    </div>

    <!-- JavaScript -->

    <script src="script.js"></script>
  </body>
</html>
```
